# Traefik IngressRoute HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-https-ingress
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.slux-solutions.com`)  # UPDATE THIS to your domain
      kind: Rule
      services:
        - name: authentik-server-service
          port: 9000
  tls:
    secretName: slux-solutions-wildcard-cert
---
# Traefik IngressRoute HTTP (with redirect)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-http-ingress
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.slux-solutions.com`)  # UPDATE THIS to your domain
      kind: Rule
      middlewares:
        - name: https-redirect
          namespace: authentik
      services:
        - name: authentik-server-service
          port: 9000