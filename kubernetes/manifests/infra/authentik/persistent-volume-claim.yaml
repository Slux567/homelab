# PersistentVolumeClaim for Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: redis-nfs-storage-class
  resources:
    requests:
      storage: 5Gi
---
# PersistentVolumeClaim for Authentik Media
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media-pvc
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: authentik-media-nfs-storage-class
  resources:
    requests:
      storage: 10Gi