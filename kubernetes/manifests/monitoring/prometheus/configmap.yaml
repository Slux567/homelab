apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node_exporter_proxmox'
        static_configs:
          - targets: ['192.168.20.10:9100', '192.168.20.20:9100', '192.168.20.30:9100']