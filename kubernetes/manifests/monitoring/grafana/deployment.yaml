apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: http-grafana
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        env:
          - name: GF_AUTH_GENERIC_OAUTH_ENABLED
            value: "true"
          - name: GF_AUTH_GENERIC_OAUTH_NAME
            value: "authentik"
          - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: grafana-oauth-secret
                key: client-id
          - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: grafana-oauth-secret
                key: client-secret
          - name: GF_AUTH_GENERIC_OAUTH_SCOPES
            value: "openid profile email"
          - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
            value: "https://auth.slux-solutions.com/application/o/authorize/"
          - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
            value: "https://auth.slux-solutions.com/application/o/token/"
          - name: GF_AUTH_GENERIC_OAUTH_API_URL
            value: "https://auth.slux-solutions.com/application/o/userinfo/"
          - name: GF_AUTH_SIGNOUT_REDIRECT_URL
            value: "https://auth.slux-solutions.com/application/o/grafana/end-session/"
          - name: GF_AUTH_OAUTH_AUTO_LOGIN
            value: "true"
          - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
            value: "contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
          - name: GF_SERVER_ROOT_URL
            value: "https://grafana.slux-solutions.com"


      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
