---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-test-http-ingress
  namespace: default
spec:
  entryPoints:
    - web # This is Traefik's default entrypoint for HTTP traffic (port 80)
  routes:
    - match: Host(`test.slux-solutions.com`)
      kind: Rule
      middlewares: # http 2 https middleware
        - name: https-redirect
          namespace: default
      services: # A service must be defined, but it won't be reached
        - name: nginx-test-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-test-https-ingress
  namespace: default
spec:
  entryPoints:
    - websecure # This is Traefik's default entrypoint for HTTPS traffic (port 443)
  routes:
    - match: Host(`test.slux-solutions.com`)
      kind: Rule
      services:
        - name: nginx-test-service
          port: 80
  tls:
    secretName: slux-solutions-wildcard-cert