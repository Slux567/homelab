apiVersion: v1
kind: Service
metadata:
  name: truenas-endpoint
  namespace: truenas
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-endpoint
  namespace: truenas
subsets:
  - addresses:
      - ip: 10.40.10.10
    ports:
      - name: http
        port: 80
      - name: https
        port: 443