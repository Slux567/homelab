csiDriver:
  # should be globally unique for a given cluster
  name: "nfs"

storageClasses:
- name: nfs-delete
  defaultClass: false
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    fsType: nfs
    detachedVolumesFromSnapshots: "false"
  mountOptions:
  - noatime
  - nfsvers=4
  secrets:
    provisioner-secret:
    controller-publish-secret:
    node-stage-secret:
    node-publish-secret:
    controller-expand-secret:

- name: nfs-retain
  defaultClass: false
  reclaimPolicy: Retain
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    fsType: nfs
    detachedVolumesFromSnapshots: "false"
  mountOptions:
  - noatime
  - nfsvers=4
  secrets:
    provisioner-secret:
    controller-publish-secret:
    node-stage-secret:
    node-publish-secret:
    controller-expand-secret:


driver:
  config:
    driver: freenas-api-nfs
    instance_id:
    httpConnection:
      protocol: http
      host: 10.40.10.10
      port: 80
      username: democratic
      apiKey: 3-I1v9FUd5GqpHrpQpZ3QSvqAs8o74gKkJMx8XmCngRQb9xSLlS0CDGy0u8IYwXUrj
      allowInsecure: true
    zfs:  
      datasetParentName: tank/k3s/volumes
      detachedSnapshotsDatasetParentName: tank/k3s/snapshots
      datasetEnableQuotas: true
      datasetEnableReservation: false
      datasetPermissionsMode: "0777"
      datasetPermissionsUser: 1000
      datasetPermissionsGroup: 1000
      datasetProperties:
        "org.freenas:description": "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }} - {{ parameters.[csi.storage.k8s.io/pvc/name] }}"
    nfs:
      shareCommentTemplate: "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}-{{ parameters.[csi.storage.k8s.io/pvc/name] }}"
      shareHost: 10.40.10.10
      shareAlldirs: false
      shareAllowedHosts: []
      shareAllowedNetworks: []
      shareMaprootUser: ""
      shareMaprootGroup: ""
      shareMapallUser: "1000"
      shareMapallGroup: "1000"

controller:
  driver:
    image:
      tag: next