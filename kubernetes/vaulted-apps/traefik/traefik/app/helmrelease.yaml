---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
  interval: 1h
  values:
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        # -- Enable Traefik Gateway provider for Gateway API
        enabled: true
    gateway:
      # -- When providers.kubernetesGateway.enabled, deploy a default gateway (Disabled cause I deploy my own in config)!
      enabled: false