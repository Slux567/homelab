apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
  namespace: postgres-cluster
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1

  storage:
    size: 50Gi
    storageClass: nfs-subdir-external-provisioner

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"