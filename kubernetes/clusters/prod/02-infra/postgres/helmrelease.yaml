apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: postgres
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      version: 18.2.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    global:
      postgresql:
        auth:
          existingSecret: postgres-credentials
    primary:
      persistence:
        enabled: true
        existingClaim: postgres-pvc

