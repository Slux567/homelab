apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  timeout: 15m0s 
  interval: 5m
  chart:
    spec:
      chart: authentik
      version: 2025.10.1
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    createNamespace: true
  values:
    authentik:
      secret_key: "PleaseGenerateASecureKey"
      # This sends anonymous usage-data, stack traces on errors and
      # performance data to sentry.io, and is fully opt-in
      error_reporting:
          enabled: false
      postgresql:
        host: file:///postgres-creds/HOST
        user: file:///postgres-creds/LOGIN
        password: file:///postgres-creds/PASSWORD

    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          kubernetes.io/ingress.class: traefik
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - auth.sluxcloud.com
      volumes:
        - name: postgres-creds
          secret:
            secretName: authentik-db-secret-authentik-user
      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true

    worker:
      volumes:
        - name: postgres-creds
          secret:
            secretName: authentik-db-secret-authentik-user
      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: values.yaml

