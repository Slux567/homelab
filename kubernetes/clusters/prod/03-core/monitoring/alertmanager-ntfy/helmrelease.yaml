apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager-ntfy
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: alertmanager-ntfy
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: alertmanager-ntfy
        namespace: flux-system
  install:
    createNamespace: true
  values:
    image:
      tag: 1.0.2

    config:
      http:
        addr: :8000

      ntfy:
        baseurl: 'http://ntfy-svc.monitoring.svc.cluster.local:80'
        notification:
          topic: prometheus
          priority: |
            status == "firing" ? "urgent" : "default"
          tags:
            - tag: "+1"
              condition: status == "resolved"
            - tag: rotating_light
              condition: status == "firing"
          templates:
            title: |
              {{ if eq .Status "resolved" }}Resolved: {{ end }}{{ index .Annotations "summary" }}
            description: |
              {{ index .Annotations "description" }}
            headers:
              X-Click: |
                {{ .GeneratorURL }}
  valuesFrom:
    - kind: Secret
      name: alertmanager-ntfy-secrets
      valuesKey: values.yaml