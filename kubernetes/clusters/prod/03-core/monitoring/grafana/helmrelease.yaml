apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: 10.1.4
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  install:
    createNamespace: true
  values:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/proxy-body-size: "0"
      hosts:
        - grafana.sluxcloud.com

    persistence:
      enabled: true
      existingClaim: grafana-data-pvc
      size: 10Gi

    initChownData:
      enabled: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    grafana.ini:
      auth:
        signout_redirect_url: "https://auth.sluxcloud.com/application/o/grafana/end-session/"
        oauth_auto_login: true
      auth.generic_oauth:
        name: authentik
        enabled: true
        client_id: "DGGqwjptxPxg6fNoW19baa2IkMdPC1Y9sxYsB8Ou"
        client_secret:
          secretName: grafana-secrets
          key: client_secret
        scopes: "openid profile email"
        auth_url: "https://auth.sluxcloud.com/application/o/authorize/"
        token_url: "https://auth.sluxcloud.com/application/o/token/"
        api_url: "https://auth.sluxcloud.com/application/o/userinfo/"
        role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'