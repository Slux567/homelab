global:
  resolve_timeout: 5m

route:
  receiver: 'ntfy-default'
  group_by: ['alertname', 'cluster']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
- name: 'ntfy-default'
  webhook_configs:
  - url: 'http://ntfy-svc.monitoring.svc.cluster.local:80/prometheus' # ⬅️ Replace with your ntfy URL
    send_resolved: true
    max_alerts: 0