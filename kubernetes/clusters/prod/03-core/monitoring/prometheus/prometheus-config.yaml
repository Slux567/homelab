apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node_exporter'
        scrape_interval: 15s

        static_configs:
          # ----------------------------------------------------
          # Proxmox Nodes
          # ----------------------------------------------------
          - targets:
              - '192.168.1.41:9100'
              - '192.168.1.42:9100'
              - '192.168.1.43:9100'
            labels:
              cluster: proxmox
              role: proxmox

          # ----------------------------------------------------
          # K3s Masters
          # ----------------------------------------------------
          - targets:
              - '192.168.1.10:9100'
              - '192.168.1.11:9100'
              - '192.168.1.12:9100'
            labels:
              cluster: k3s
              role: master

          # ----------------------------------------------------
          # K3s Workers
          # ----------------------------------------------------
          - targets:
              - '192.168.1.20:9100'
              - '192.168.1.21:9100'
              - '192.168.1.22:9100'
            labels:
              cluster: k3s
              role: worker
