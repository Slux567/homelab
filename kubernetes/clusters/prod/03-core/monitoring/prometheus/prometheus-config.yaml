apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node_exporter'
        static_configs:
          - targets:
              # Proxmox nodes
              - '192.168.1.41:9100'
              - '192.168.1.42:9100'
              - '192.168.1.43:9100'

              # K3s masters
              - '192.168.1.10:9100'
              - '192.168.1.11:9100'
              - '192.168.1.12:9100'

              # K3s workers
              - '192.168.1.20:9100'
              - '192.168.1.21:9100'
              - '192.168.1.22:9100'
