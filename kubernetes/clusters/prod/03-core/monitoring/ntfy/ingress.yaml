apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
  - host: ntfy.${SECRET_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: ntfy-svc
            port:
              number: 80
        path: /
        pathType: Prefix