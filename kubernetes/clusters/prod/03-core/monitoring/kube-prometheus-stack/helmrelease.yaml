---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 15m
  ref:
    tag: 80.14.4
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  interval: 1h
  values:

    alertmanager:
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - alertmanager.${SECRET_DOMAIN}
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager-config
          global:
            resolveTimeout: 5m
      externalUrl: https://alertmanager.${SECRET_DOMAIN}
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.default.message" }}

          {{- if eq .Status "firing" -}}
            {{- if eq .CommonLabels.severity "critical" -}}
          🔴 Alert: {{ template "telegram.escape" .CommonLabels.alertname }}
            {{- else if eq .CommonLabels.severity "warning" -}}
          🟠 Alert: {{ template "telegram.escape" .CommonLabels.alertname }}
            {{- else -}}
          ⚪️ Alert: {{ template "telegram.escape" .CommonLabels.alertname }}
            {{- end }}
          Status: 🔥 FIRING
          Severity: {{ template "telegram.escape" (.CommonLabels.severity | title) }}
          {{- else if eq .Status "resolved" -}}
          ⚪️ Alert: {{ template "telegram.escape" .CommonLabels.alertname }}
          Status: ✅ RESOLVED
          Severity: {{ template "telegram.escape" (.CommonLabels.severity | title) }}
          {{- end }}

          {{- range .Alerts }}

          {{- if .Labels.job }}
          Job: `{{ template "telegram.escape" .Labels.job }}`
          {{- end }}

          {{- if .Labels.namespace }}
          Namespace: `{{ template "telegram.escape" .Labels.namespace }}`
          {{- end }}

          {{- if .Labels.instance }}
          Instance: `{{ template "telegram.escape" .Labels.instance }}`
          {{- end }}

          {{- if .Annotations.runbook_url }}
          [RunbookURL]({{ template "telegram.escape" .Annotations.runbook_url }})
          {{- end }}

          {{- end }}
          {{ end }}


    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.${SECRET_DOMAIN}
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus-data-pv
              resources:
                requests:
                  storage: 50Gi

    grafana:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.${SECRET_DOMAIN}
      env:
        GF_SERVER_ROOT_URL: https://grafana.${SECRET_DOMAIN}
      initChownData:
        enabled: false
      persistence:
        enabled: true
        existingClaim: grafana-data-pvc
