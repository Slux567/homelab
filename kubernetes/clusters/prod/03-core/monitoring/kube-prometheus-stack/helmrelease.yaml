---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 15m
  ref:
    tag: 80.14.4
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  interval: 1h
  values:

    alertmanager:
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - alertmanager.${SECRET_DOMAIN}
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager-config
          global:
            resolveTimeout: 5m
      externalUrl: https://alertmanager.${SECRET_DOMAIN}
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
      templateFiles:
        telegram.tmpl: |-
          {{- define "telegram.escape" -}}
          {{- reReplaceAll "([_*\\[\\]()~`>#+\\-=|{}.!])" "\\\\${1}" . -}}
          {{- end -}}

          {{ define "telegram.default.message" }}
          {{- if eq .Status "firing" -}}
              {{- if eq .CommonLabels.severity "critical" -}}
                  🔴 Alert: {{ .CommonLabels.alertname }}
              {{- else if eq .CommonLabels.severity "warning" -}}
                  🟠 Alert: {{ .CommonLabels.alertname }}
              {{- else -}}
                  ⚪️ Alert: {{ .CommonLabels.alertname }}
              {{- end }}
          Status: 🔥 FIRING
          Severity: {{ if eq .CommonLabels.severity "critical" }}🔴 {{ .CommonLabels.severity | title }}{{ else if eq .CommonLabels.severity "warning" }}🟠 {{ .CommonLabels.severity | title }}{{ else }}⚪️ {{ .CommonLabels.severity | title }}{{ end }}
          {{- else if eq .Status "resolved" -}}
              ⚪️ Alert: {{ .CommonLabels.alertname }}
          Status: ✅ RESOLVED
          Severity: {{ if eq .CommonLabels.severity "critical" }}🟢 {{ .CommonLabels.severity | title }}{{ else if eq .CommonLabels.severity "warning" }}🟢 {{ .CommonLabels.severity | title }}{{ else }}⚪️ {{ .CommonLabels.severity | title }}{{ end }}
          {{- end }}

          {{- range .Alerts -}}

          {{- if .Labels.job }}
          Job: `{{ .Labels.job }}`
          {{- end }}

          {{- if .Labels.namespace }}
          Namespace: `{{ .Labels.namespace }}`
          {{- end }}

          {{- if .Labels.instance }}
          Instance: `{{ .Labels.instance }}`
          {{- end }}

          {{- if .Annotations.runbook_url }}
          [RunbookURL]({{ .Annotations.runbook_url }})

          {{- end }}
          {{- end }}
          {{ end }}

    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.${SECRET_DOMAIN}
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: prometheus-data-pv
              resources:
                requests:
                  storage: 50Gi

    grafana:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.${SECRET_DOMAIN}
      env:
        GF_SERVER_ROOT_URL: https://grafana.${SECRET_DOMAIN}
      initChownData:
        enabled: false
      persistence:
        enabled: true
        existingClaim: grafana-data-pvc
