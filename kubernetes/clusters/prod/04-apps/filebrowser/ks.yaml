apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: filebrowser
  namespace: flux-system
spec:
  dependsOn:
    - name: 03-core
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./kubernetes/clusters/prod/04-apps/filebrowser/app"
  decryption:
    provider: sops
    secretRef:
      name: sops-age