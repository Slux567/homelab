apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          main:
            image:
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 1.0.2-stable
            env:
              FILEBROWSER_DISABLE_AUTOMATIC_BACKUP: true
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 80

    ingress:
      main:
        className: traefik
        annotations:
          kubernetes.io/ingress.class: traefik
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: files.sluxcloud.com
            paths:
              - path: /
                pathType: Prefix

    persistence:
      srv:
        type: persistentVolumeClaim
        existingClaim: filebrowser-srv-pvc
        globalMounts:
          - path: /srv
      config:
        type: persistentVolumeClaim
        existingClaim: filebrowser-config-pvc
        globalMounts:
          - path: /config
      database:
        type: persistentVolumeClaim
        existingClaim: filebrowser-database-pvc
        globalMounts:
          - path: /database
