apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-media-policy
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
      - kube-apiserver
      - host
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: homepage
            io.kubernetes.pod.namespace: selfhosted
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: internal
            io.kubernetes.pod.namespace: envoy-gateway
