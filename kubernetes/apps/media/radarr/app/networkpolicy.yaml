apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radarr

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: selfhosted
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage