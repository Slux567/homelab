---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      main:
        containers:
          qbittorrent:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.1.4@sha256:56ecd30a7f5e1357daf5eea2a6935134d329b7b268a3a9b9c67041b65fb87fc6
            env:
              TZ: ${TIMEZONE}
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: "50469"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi

    service:
      qbittorrent:
        controller: main
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: "${QBITTORRENT_IP}"
        ports:
          http:
            port: *port
          bittorrent-tcp:
            port: 50469
            protocol: TCP
          bittorrent-udp:
            port: 50469
            protocol: UDP

    configMaps:
      config:
        data:
          .qbt.toml: |-
            [qbittorrent]
            addr = "http://0.0.0.0:80"

    route:
      qbittorrent:
        parentRefs:
          - name: internal
            namespace: envoy-gateway
        hostnames:
          - qb.sluxcloud.com
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: qbittorrent-config
        advancedMounts:
          main:
            qbittorrent:
              - path: /config
      config-file:
        type: configMap
        identifier: config
        advancedMounts:
          main:
            qbittorrent:
              - path: /config/.qbt.toml
                subPath: .qbt.toml
      media:
        existingClaim: media-storage
        advancedMounts:
          main:
            qbittorrent:
              - path: /media
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            qbittorrent:
              - path: /tmp