apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app qbittorrent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
    - secretKey: &key WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: *app
        property: *key