---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      version: 0.15.3
      sourceRef:
        kind: HelmRepository
        name: metallb
      interval: 5m
  values:
    crds:
      enabled: true
    prometheus:
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: observability
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true