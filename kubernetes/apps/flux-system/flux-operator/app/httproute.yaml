apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  parentRefs:
  - name: internal
    namespace: envoy-gateway
    sectionName: https
  hostnames:
  - "flux.${DOMAIN_01}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: flux-operator
      port: 9080