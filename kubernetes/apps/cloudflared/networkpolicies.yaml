apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-cloudflared-policy
  namespace: cloudflared
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
      - kube-apiserver
      - host
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: external
            io.kubernetes.pod.namespace: envoy-gateway
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.42.0.0/16        # pod CIDR
            - 10.96.0.0/12        # service CIDR
            - 192.168.0.0/16      # private range
            - 10.0.40.0/24        # Storage CIDR
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: TCP
            - port: "7844"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: external
            io.kubernetes.pod.namespace: envoy-gateway
