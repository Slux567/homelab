---
# The portfolio chart only supports a single hostname, so www gets its own route to the same Service
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-www
spec:
  parentRefs:
    - name: external
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - "www.${DOMAIN_02}"
  rules:
    - backendRefs:
        - name: portfolio
          port: 80
