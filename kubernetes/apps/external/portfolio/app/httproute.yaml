apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
spec:
  parentRefs:
  - name: external
    namespace: envoy-gateway
    sectionName: https
  hostnames:
  - "portfolio.sluxcloud.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: portfolio
      port: 80