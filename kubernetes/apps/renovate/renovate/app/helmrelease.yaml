---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  interval: 5m
  chart:
    spec:
      chart: renovate
      version: 46.82.1
      sourceRef:
        kind: HelmRepository
        name: renovate
  values:
    envFrom:
    - secretRef:
        name: renovate
    cronjob:
      schedule: "* 6 * * *" # Run every day at 6am
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: "0"
      jobTemplate:
        spec:
          ttlSecondsAfterFinished: 600
    redis:
      enabled: true  
    renovate:
      config: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",

          "extends": [
            "config:recommended",
            ":dependencyDashboard",
            ":semanticCommits",
            ":timezone(Europe/Amsterdam)"
          ],

          "platformAutomerge": true,
          "automergeType": "pr",

          "schedule": ["after 6am and before 11pm"],

          "prHourlyLimit": 4,
          "prConcurrentLimit": 10,

          "rebaseWhen": "behind-base-branch",

          "labels": ["dependencies"],

          "kubernetes": {
            "fileMatch": ["\\.ya?ml$"]
          },

          "flux": {
            "fileMatch": ["\\.ya?ml$"]
          },

          "helm-values": {
            "fileMatch": ["(^|/)values\\.ya?ml$"]
          },

          "regexManagers": [
            {
              "fileMatch": ["\\.ya?ml$"],
              "matchStrings": [
                "image:\\s*(?<depName>[^:\\s]+):(?<currentValue>[^\\s]+)"
              ],
              "datasourceTemplate": "docker"
            }
          ],

          "packageRules": [
            {
              "description": "Auto-merge patch updates",
              "matchUpdateTypes": ["patch"],
              "automerge": true
            },
            {
              "description": "Auto-merge minor updates for trusted deps",
              "matchUpdateTypes": ["minor"],
              "matchDatasources": ["docker", "helm"],
              "automerge": true
            },
            {
              "description": "Group all Kubernetes YAML updates",
              "matchManagers": ["kubernetes", "flux"],
              "groupName": "kubernetes manifests"
            },
            {
              "description": "Group Helm chart updates",
              "matchManagers": ["helm-values"],
              "groupName": "helm charts"
            },
            {
              "description": "Pin Docker digests",
              "matchDatasources": ["docker"],
              "pinDigests": true
            },
            {
              "description": "Stability days for major updates",
              "matchUpdateTypes": ["major"],
              "stabilityDays": 3,
              "automerge": false
            },
            {
              "description": "Ignore super noisy images",
              "matchPackagePatterns": ["^ghcr.io/.*/nightly"],
              "enabled": false
            }
          ],

          "dependencyDashboard": true,

          "commitMessagePrefix": "⬆️ ",
          "commitMessageAction": "update",
          "commitMessageTopic": "{{depName}}",

          "prBodyNotes": [
            "⚙️ Managed by Renovate for Flux GitOps"
          ]
        }
    persistence:
      cache:
        enabled: true
        storageClass: "k8s-nfs"
        storageSize: "512Mi"