# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  interval: 5m
  chart:
    spec:
      chart: renovate
      version: 46.171.0
      sourceRef:
        kind: HelmRepository
        name: renovate

  values:
    envFrom:
      - secretRef:
          name: renovate

    cronjob:
      schedule: "0 6 * * *"
      successfulJobsHistoryLimit: 1
      jobTemplate:
        spec:
          ttlSecondsAfterFinished: 600

    redis:
      enabled: true  

    renovate:
      config: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",

          "extends": [
            "config:recommended",
            ":dependencyDashboard",
            ":semanticCommits",
            ":timezone(Europe/Amsterdam)"
          ],

          "platformAutomerge": true,
          "automergeType": "pr",
          "automergeStrategy": "squash",

          "prCreation": "immediate",

          "schedule": ["after 6am and before 11pm"],

          "prHourlyLimit": 4,
          "prConcurrentLimit": 10,

          "rebaseWhen": "behind-base-branch",

          "labels": ["dependencies"],

          "kubernetes": {
            "fileMatch": ["\\.ya?ml$"]
          },

          "flux": {
            "fileMatch": ["\\.ya?ml$"]
          },

          "helm-values": {
            "fileMatch": ["(^|/)values\\.ya?ml$"]
          },

          "regexManagers": [
            {
              "fileMatch": ["\\.ya?ml$"],
              "matchStrings": [
                "image:\\s*(?<depName>[^:\\s]+):(?<currentValue>[^\\s]+)"
              ],
              "datasourceTemplate": "docker"
            }
          ],

          "packageRules": [
            {
              "description": "Auto-merge patch updates",
              "matchUpdateTypes": ["patch"],
              "automerge": true
            },
            {
              "description": "Auto-merge minor updates",
              "matchUpdateTypes": ["minor"],
              "matchDatasources": ["docker", "helm"],
              "automerge": true
            },
            {
              "description": "Group Kubernetes resources",
              "matchManagers": ["kubernetes", "flux"],
              "groupName": "kubernetes"
            },
            {
              "description": "Group Helm charts",
              "matchManagers": ["helm-values"],
              "groupName": "helm"
            },
            {
              "description": "Pin Docker digests",
              "matchDatasources": ["docker"],
              "pinDigests": false
            },
            {
              "description": "Major updates need manual review",
              "matchUpdateTypes": ["major"],
              "stabilityDays": 3,
              "automerge": false
            }
          ],

          "dependencyDashboard": true,

          "commitMessagePrefix": "⬆️ ",
          "commitMessageAction": "update",
          "commitMessageTopic": "{{depName}}",

          "prBodyNotes": [
            "⚙️ Managed by Renovate (self-hosted via Flux)"
          ]
        }

    persistence:
      cache:
        enabled: true
        storageClass: "k8s-nfs"
        storageSize: "512Mi"