apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
  data:
    # 🔑 GitHub token
    - secretKey: &key RENOVATE_TOKEN
      remoteRef:
        key: *app
        property: *key

    # 🌐 Platform config
    - secretKey: &key RENOVATE_PLATFORM
      remoteRef:
        key: *app
        property: *key

    - secretKey: &key RENOVATE_ENDPOINT
      remoteRef:
        key: *app
        property: *key

    # 📦 Repo(s) to scan
    - secretKey: &key RENOVATE_REPOSITORIES
      remoteRef:
        key: *app
        property: *key

    # 👤 Git identity
    - secretKey: &key RENOVATE_GIT_AUTHOR
      remoteRef:
        key: *app
        property: *key

    # 🧾 Logging (optional but recommended)
    - secretKey: &key LOG_LEVEL
      remoteRef:
        key: *app
        property: *key