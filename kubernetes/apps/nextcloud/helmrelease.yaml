apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  chart:
    spec:
      chart: nextcloud
      version: "8.4.0"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: nextcloud-values
      valuesKey: values.yaml
    - kind: Secret
      name: nextcloud-secrets
      valuesKey: values.yaml
