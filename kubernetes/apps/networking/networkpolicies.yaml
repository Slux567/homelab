apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-networking-policy
  namespace: networking
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
      - kube-apiserver
      - host
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.42.0.0/16        # pod CIDR
            - 10.96.0.0/12        # service CIDR
            - 192.168.0.0/16      # Home Network Range
            - 10.0.40.0/24        # Storage CIDR
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns-unifi-policy
  namespace: networking
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: external-dns-unifi
  egress:
    - toCIDRSet:
        - cidr: 192.168.1.254/32