---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-unifi-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: external-dns-unifi-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-key: "{{ .UNIFI_API_KEY }}"
  dataFrom:
    - extract:
        key: unifi