apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-postgres-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: ext-postgres-operator
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: ext-postgres-operator
  valuesFrom:
    - kind: Secret
      name: ext-postgres-operator
      valuesKey: values.yaml
