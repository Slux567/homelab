apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 5m
  chart:
    spec:
      chart: authentik
      version: 2025.10.1
      sourceRef:
        kind: HelmRepository
        name: authentik
  install:
    createNamespace: true
  values:
    authentik:
      error_reporting:
          enabled: false
      postgresql:
        host: file:///postgres-creds/HOST
        user: file:///postgres-creds/LOGIN
        password: file:///postgres-creds/PASSWORD

    server:
      route:
        main:
          enabled: true
          hostnames:
            - "auth.${DOMAIN_01}"
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      volumes:
        - name: postgres-creds
          secret:
            secretName: authentik-db-secret-authentik-user
      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true

    worker:
      volumes:
        - name: postgres-creds
          secret:
            secretName: authentik-db-secret-authentik-user
      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
      valuesKey: values.yaml

