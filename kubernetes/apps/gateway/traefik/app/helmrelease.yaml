---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
  interval: 1h
  values:
    providers:
      # Disable the Ingress provider
      kubernetesIngress:
        enabled: false
      # Enable the GatewayAPI provider
      kubernetesGateway:
        enabled: true

    # Creates a gateway class
    gatewayClass:
      enabled: true


    # Allow the Gateway to expose HTTPRoute from all namespaces
    gateway:
      namespacePolicy: All