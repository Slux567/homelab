apiVersion: db.movetokube.com/v1alpha1
kind: Postgres
metadata:
  name: nextcloud
spec:
  database: nextcloud
  dropOnDelete: false
  masterRole: nextcloud_user
  schemas:
    - public
---
apiVersion: db.movetokube.com/v1alpha1
kind: PostgresUser
metadata:
  name: nextcloud
spec:
  role: nextcloud_user
  database: nextcloud
  secretName: postgres-secret
  privileges: OWNER
  secretTemplate:
    PQ_URL: "host={{.Host}} user={{.Role}} password={{.Password}} dbname={{.Database}}"
