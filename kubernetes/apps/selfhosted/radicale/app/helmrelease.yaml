---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radicale
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 5m

  values:
      controllers:
        radicale:
          annotations:
            reloader.stakater.com/auto: "true"
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: "OnRootMismatch"
          containers:
            app:
              image:
                repository: ghcr.io/kozea/radicale
                tag: 3.7.8
              args:
                - --config
                - /config/config
              probes:
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /
                      port: 5232
                    periodSeconds: 10
                    timeoutSeconds: 1
                    failureThreshold: 3
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /
                      port: 5232
                    periodSeconds: 10
                    timeoutSeconds: 1
                    failureThreshold: 3
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /
                      port: 5232
                    failureThreshold: 30
                    periodSeconds: 5
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 15m
                  memory: 105Mi
                limits:
                  memory: 256M

      service:
        app:
          controller: radicale
          ports:
            http:
              port: 5232

      route:
        app:
          hostnames:
            - "{{ .Release.Name }}.${DOMAIN_01}"
          parentRefs:
            - name: internal
              namespace: envoy-gateway
          rules:
            - backendRefs:
                - identifier: app
                  port: 5232
      persistence:
        data:
          existingClaim: radicale
          advancedMounts:
            radicale:
              app:
                - path: /data
        config:
          type: configMap
          name: radicale-config
          globalMounts:
            - path: /config/config
              subPath: config.cfg
              readOnly: true
        auth:
          type: secret
          name: radicale
          globalMounts:
            - path: /config/users
              subPath: users
              readOnly: true