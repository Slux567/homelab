---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  bookmarks.yaml: ""
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  services.yaml: |
    - media:
        - Plex:
            icon: plex.png
            href: https://plex.${DOMAIN_01}/
            description: Movies & TV
            namespace: media
            app: plex
            widget:
              type: plex
              url: http://plex.media.svc.cluster.local:32400
              key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
        - Seerr:
            icon: seerr.png
            href: https://requests.${DOMAIN_01}/
            description: Media requests
            namespace: media
            app: seerr
            widget:
              type: seerr
              url: http://seerr.media.svc.cluster.local:5055
              key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
        - Radarr:
            icon: radarr.png
            href: https://radarr.${DOMAIN_01}/
            description: Movie management
            namespace: media
            app: radarr
            widget:
              type: radarr
              url: http://radarr.media.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.${DOMAIN_01}/
            description: TV management
            namespace: media
            app: sonarr
            widget:
              type: sonarr
              url: http://sonarr.media.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.${DOMAIN_01}/
            description: Indexer management
            namespace: media
            app: prowlarr
            widget:
              type: prowlarr
              url: http://prowlarr.media.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
        - Bazarr:
            icon: bazarr.png
            href: https://bazarr.${DOMAIN_01}/
            description: Subtitle management
            namespace: media
            app: bazarr
        - NZBGet:
            icon: nzbget.png
            href: https://nzbget.${DOMAIN_01}/
            description: Usenet client
            namespace: media
            app: nzbget
    - selfhosted:
        - Filebrowser:
            icon: filebrowser.png
            href: https://filebrowser.${DOMAIN_01}/
            description: File browser
            namespace: selfhosted
            app: filebrowser
        - Immich:
            icon: immich.png
            href: https://photos.${DOMAIN_01}/
            description: Photo backup
            namespace: selfhosted
            app: immich
            podSelector: app.kubernetes.io/instance=immich
        - Syncthing:
            icon: syncthing.png
            href: https://sync.${DOMAIN_01}/
            description: File sync
            namespace: selfhosted
            app: syncthing
        - Radicale:
            icon: radicale.png
            href: https://radicale.${DOMAIN_01}/
            description: CalDAV & CardDAV
            namespace: selfhosted
            app: radicale
        - n8n:
            icon: n8n.png
            href: https://n8n.${DOMAIN_01}/
            description: Workflow automation
            namespace: selfhosted
            app: n8n
    - home-automation:
        - Home Assistant:
            icon: home-assistant.png
            href: https://hass.${DOMAIN_01}/
            description: Home automation
            namespace: home-automation
            app: home-assistant
        - ESPHome:
            icon: esphome.png
            href: https://esphome.${DOMAIN_01}/
            description: Device firmware
            namespace: home-automation
            app: esphome
            widget:
              type: esphome
              url: http://esphome.home-automation.svc.cluster.local:6052
    - security:
        - Pocket ID:
            icon: pocket-id.png
            href: https://id.${DOMAIN_01}/
            description: Identity provider
            namespace: security
            app: pocket-id
        - Tinyauth:
            icon: tinyauth.png
            href: https://auth.${DOMAIN_01}/
            description: Auth proxy
            namespace: security
            app: tinyauth
        - 1Password Connect:
            icon: 1password.png
            href: https://onepassword-connect.${DOMAIN_01}/
            description: Secrets management
            namespace: security
            app: onepassword-connect
    - observability:
        - Grafana:
            icon: grafana.png
            href: https://grafana.${DOMAIN_01}/
            description: Dashboards
            namespace: observability
            app: grafana
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.${DOMAIN_01}/
            description: Metrics
            namespace: observability
            app: prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        - Alertmanager:
            icon: alertmanager.png
            href: https://alertmanager.${DOMAIN_01}/
            description: Alerting
            namespace: observability
            app: alertmanager
  settings.yaml: |
    title: sluxcloud
    headerStyle: clean
    layout:
      media:
        style: columns
        columns: 3
      selfhosted:
        style: columns
        columns: 3
      home-automation:
        style: row
        columns: 2
      security:
        style: row
        columns: 3
      observability:
        style: row
        columns: 3
  widgets.yaml: |
    - search:
        provider: duckduckgo
        focus: true
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Sluxcloud Cluster"
        nodes:
          show: false