---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  bookmarks.yaml: |
    - Personal:
        - Rabobank:
            - icon: mdi-bank
              href: https://banking.rabobank.com/business/overview
        - Degiro:
            - icon: mdi-elevation-rise
              href: https://trader.degiro.nl/
    - Homelab:
        - GitHub:
            - icon: si-github
              href: https://github.com/Slux567/homelab
        - Claude:
            - icon: si-claude
              href: https://claude.ai/
    - Media:
        - YouTube:
            - icon: si-youtube
              href: https://youtube.com/feed/subscriptions
        - Reddit:
            - icon: si-reddit
              href: https://www.reddit.com/
    - Reading:
        - Tweakers:
            - icon: si-toml
              href: https://tweakers.net/
        - NOS:
            - icon: mdi-alpha-o-circle
              href: https://nos.nl/
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  services.yaml: |
    - Infrastructure:
        - Unifi:
            icon: unifi.png
            href: https://192.168.1.254/
            description: Unifi Controller
            widget:
              type: unifi
              fields: ["uptime", "wan", "lan", "lan_users"]
              url: https://192.168.1.254/
              key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
        - TrueNAS:
            icon: truenas.png
            href: https://truenas.sluxcloud.com/
            Description: TrueNAS Scale
            widget:
              type: truenas
              url: http://10.0.40.50/
              version: 2
              key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
              enablePools: true 
              nasType: scale
  settings.yaml: |
    title: sluxcloud
    headerStyle: clean
    layout:
      Infrastructure:
        style: row
        columns: 2
      Media:
        style: columns
        columns: 3
      Selfhosted:
        style: columns
        columns: 4
  widgets.yaml: |
    - search:
        provider: duckduckgo
        focus: true
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Sluxcloud Cluster"
        nodes:
          show: false