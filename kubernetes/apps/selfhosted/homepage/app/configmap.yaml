---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  bookmarks.yaml: |
    - Communicate:
        - Discord:
            - icon: si-discord
              href: https://discord.com
    - Git:
        - home-ops:
            - icon: si-github
              href: https://github.com/Slux567/homelab
    - Media:
        - YouTube:
            - icon: si-youtube
              href: https://youtube.com/feed/subscriptions
    - Reading:
        - Hacker News:
            - icon: si-ycombinator
              href: https://news.ycombinator.com/
        - Tildes:
            - icon: mdi-forum
              href: https://tildes.net/
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  services.yaml: |
    - Infrastructure:
        - Unifi:
            icon: unifi.png
            href: https://192.168.1.254/
            description: Unifi Controller
            widget:
              type: unifi
              fields: ["uptime", "wan", "lan", "lan_users"]
              url: https://192.168.1.254/
              key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
        - TrueNAS:
            icon: truenas.png
            href: https://truenas.sluxcloud.com/
            Description: TrueNAS Scale
            widget:
              type: truenas
              url: http://10.0.40.50/
              version: 2
              key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
              enablePools: true 
              nasType: scale
  settings.yaml: |
    title: sluxcloud
    headerStyle: clean
    theme: dark
    color: blue
    background: https://wallpapercat.com/w/full/e/b/4/618703-3000x2000-desktop-hd-costa-rica-background-photo.jpg
    layout:
      Infrastructure:
        style: row
        columns: 2
      Media:
        style: columns
        columns: 3
      Selfhosted:
        style: columns
        columns: 4
  widgets.yaml: |
    - search:
        provider: duckduckgo
        focus: true
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Sluxcloud Cluster"
        nodes:
          show: false