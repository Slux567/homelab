apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homepage-secrets
    creationPolicy: Owner
    template:
      data:
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HOMEPAGE_VAR_PLEX_TOKEN: "{{ .PLEX_TOKEN }}"

        HOMEPAGE_VAR_NC_TOKEN: "{{ .NC_TOKEN }}"

        HOMEPAGE_VAR_UNIFI_API_KEY: "{{ UNIFI_API_KEY }}"
  dataFrom:
    - extract:
        key: arr-stack
    - extract:
        key: nextcloud
    - extract:
        key: unifi