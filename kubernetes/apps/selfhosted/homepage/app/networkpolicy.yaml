apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-nextcloud-to-homepage
spec:
  description: "Allow ingress to Nextcloud from Homepage pod"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP