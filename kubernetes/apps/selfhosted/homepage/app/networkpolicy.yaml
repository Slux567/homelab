apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-media-to-homepage
  namespace: selfhosted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media