# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted

components:
  - ../../components/networkpolicies/baseline
  - ../../components/networkpolicies/internal
resources:
  - ./namespace.yaml
  - ./n8n/ks.yaml

patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: n8n
        namespace: flux-system
    target:
      kind: Kustomization
      name: n8n