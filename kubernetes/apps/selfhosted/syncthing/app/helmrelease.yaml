---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      syncthing:
        containers:
          app:
            image:
              repository: syncthing/syncthing
              # renovate: datasource=docker depName=syncthing/syncthing
              tag: 2.1.2
            env:
              PUID: "1000"
              PGID: "1000"
              STGUIADDRESS: "0.0.0.0:8384"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &port 8384
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
        pod:
          labels:
            networkpolicy.sluxcloud/ingress-home-vlan: "true"
            networkpolicy.sluxcloud/ingress-vpn: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      app:
        controller: syncthing
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${SYNCTHING_IP}"
        ports:
          http:
            port: *port
          sync-tcp:
            port: 22000
            protocol: TCP
          sync-udp:
            port: 22000
            protocol: UDP
          discovery:
            port: 21027
            protocol: UDP

    route:
      app:
        hostnames:
          - "sync.${DOMAIN_01}"
        parentRefs:
          - name: internal
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - name: syncthing
                port: *port

    persistence:
      config:
        existingClaim: syncthing-config
        advancedMounts:
          syncthing:
            app:
              - path: /var/syncthing/config
      data:
        existingClaim: filebrowser-data
        advancedMounts:
          syncthing:
            app:
              - path: /var/syncthing/data
