apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config
spec:
  storageClassName: "k8s-nfs"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: syncthing-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data
spec:
  storageClassName: "k8s-nfs"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  volumeName: syncthing-data
