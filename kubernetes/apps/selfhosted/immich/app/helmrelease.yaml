apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 30m
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        networkpolicy.sluxcloud/egress-postgres: "true"

    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.1.0
            env:
              REDIS_HOSTNAME: immich-valkey
              IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: DB_HOSTNAME
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: DB_USERNAME
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: DB_DATABASE_NAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: DB_PASSWORD

    immich:
      persistence:
        library:
          existingClaim: immich-library

    # Bundled Valkey (job queue / cache) - ephemeral, data loss just resets the queue
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi

    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 50m
                  memory: 512Mi
                limits:
                  memory: 4Gi
      service:
        main:
          controller: main
          ports:
            http:
              port: &port 2283
      route:
        main:
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Selfhosted
            gethomepage.dev/icon: immich.png
            gethomepage.dev/name: immich
          hostnames:
            - "photos.${DOMAIN_01}"
          parentRefs:
            - name: internal
              namespace: envoy-gateway
          rules:
            - backendRefs:
                - identifier: main
                  port: *port
              filters:
                - type: ResponseHeaderModifier
                  responseHeaderModifier:
                    add:
                      - name: strict-transport-security
                        value: max-age=31536000

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache