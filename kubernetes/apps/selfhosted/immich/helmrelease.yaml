apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      version: 0.10.0
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: immich
      interval: 1m
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
      valuesKey: values.yaml
    - kind: Secret
      name: immich-secrets
      valuesKey: values.yaml
