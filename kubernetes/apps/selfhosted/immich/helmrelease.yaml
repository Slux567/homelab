apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 10m
  releaseName: immich
  chartRef:
    kind: OCIRepository
    name: immich
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
      valuesKey: values.yaml
    - kind: Secret
      name: immich-secrets
      valuesKey: values.yaml
