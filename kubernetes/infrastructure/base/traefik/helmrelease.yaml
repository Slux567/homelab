apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: "37.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 15m
  values:
    deployment:
      replicas: 1 
    service:
      type: LoadBalancer  # MetalLB will assign an IP
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        port: 443
        exposedPort: 443
    tlsStore:
      default:
        defaultCertificate:
          secretName: sluxcloud-wildcard-cert
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.sluxcloud.com`)  # CHANGE THIS
        entryPoints: ["websecure"]