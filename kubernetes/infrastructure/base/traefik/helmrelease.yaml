apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: "37.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 15m
  values:
    deployment:
      replicas: 1 
    service:
      type: LoadBalancer  # MetalLB will assign an IP
    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
    ingressRoute:
      dashboard:
        enabled: false
        matchRule: Host(`traefik.slux-solutions.com`)  # CHANGE THIS
        entryPoints: ["websecure"]