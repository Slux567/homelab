apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-postgres-operator
  namespace: ext-postgres-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: ext-postgres-operator
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: ext-postgres-operator
        namespace: flux-system
      interval: 1m

  valuesFrom:
    - kind: Secret
      name: ext-postgres-operator-secrets
      valuesKey: values.yaml
