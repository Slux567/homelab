apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.30.100.100-10.30.100.105
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: traefik-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - traefik-ip-pool