all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

  children:
    proxmox_nodes:
      hosts:
        asgard:
          ansible_host: 192.168.20.10
        midgard:
          ansible_host: 192.168.20.20
        muspelheim:
          ansible_host: 192.168.20.30
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    pi_nodes:
      hosts:
        raspberrypi:
          ansible_host: 192.168.1.110
      vars:
        ansible_user: pi
        ansible_ssh_private_key_file: ~/.ssh/rpi

    infra_nodes:
      hosts:
        infra-1:
          ansible_host: 10.30.34.55

    local_services:
      hosts:
        local-services-1:
          ansible_host: 10.30.72.169

    public_services:
      hosts:
        public-services-1:
          ansible_host: 10.40.54.112

    kubernetes_master_nodes:
      hosts:
        kubernetes-master-1:
          ansible_host: 10.30.65.44

    kubernetes_worker_nodes:
      hosts:
        kubernetes-worker-1:
          ansible_host: 10.30.24.231
        kubernetes-worker-2:
          ansible_host: 10.30.42.194

    debian:
      children:
        infra_nodes:
        local_services:
        public_services:
        kubernetes_master_nodes:
        kubernetes_worker_nodes:
      vars:
        ansible_user: slux
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

