---
- name: Disable SWAP for current session and permanently
  block:
    - name: Disable swap for current session
      ansible.builtin.command: swapoff -a
      become: true

    - name: Disable swap permanently, persist reboots
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
        replace: '#\1\2\3swap\4'
        backup: yes


- name: Installing required system packages for installation
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - gpg
    update_cache: yes
    state: present


- name: Installing and Configuring Containerd (CRI)
  block:
    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes

    - name: Install containerd.io package
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: yes

    - name: Generate default containerd config file
      ansible.builtin.shell: |
        containerd config default > /etc/containerd/config.toml
      become: true # This task needs become

    - name: Set Systemd cgroup driver in containerd config
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      become: true # This task needs become

    - name: Restart and enable containerd service
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: restarted
      become: true # This task needs become


- name: Installing kubeadm, kubelet and kubectl
  block:
    - name: Download public signing key for the Kubernetes package repositories
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      become: true
  
    - name: Add apt repository for Kubernetes version {{ k8s_version }}
      ansible.builtin.shell: |
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list

    - name: Apt installing kubeadm, kubelet and kubectl for Kubernetes {{ k8s_version }}
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
        update_cache: yes
        state: present

    - name: Hold kubeadm, kubelet packages to prevent automatic upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
      become: true
    
    - name: Apt installing kubectl on control plane node (master)
      ansible.builtin.apt:
        name: kubectl
        update_cache: yes
        state: present
      when: inventory_hostname in groups['kubernetes_master_nodes']

    - name: Hold kubeadm, kubelet packages to prevent automatic upgrades
      ansible.builtin.dpkg_selections:
        name: kubectl
        selection: hold
      become: true
      when: inventory_hostname in groups['kubernetes_master_nodes']
    
- name: Final preperations
  block:
    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Load necessary kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules are persistent
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set sysctl params for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl params
      command: sysctl --system