- name: Detect if systemd-resolved exists
  stat:
    path: /lib/systemd/system/systemd-resolved.service
  register: resolved_service

- name: Configure systemd-resolved (Ubuntu/Debian)
  block:
    - name: Ensure systemd-resolved config exists
      file:
        path: /etc/systemd/resolved.conf
        state: touch

    - name: Remove DNS search domains completely
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^Domains='
        line: 'Domains='
        create: yes
        state: present

    - name: Ensure DNS servers are set to Cloudflare + Google
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^DNS='
        line: 'DNS=1.1.1.1 8.8.8.8'
        create: yes
        state: present

    - name: Disable LLMNR
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^LLMNR='
        line: 'LLMNR=no'
        create: yes
        state: present

    - name: Clear DNS domain for all interfaces at runtime
      shell: |
        for iface in $(ip -o link show | awk -F': ' '{print $2}' | grep -v lo); do
          resolvectl domain "$iface" "" || true
        done
      ignore_errors: true

    - name: Restart systemd-resolved if present
      systemd:
        name: systemd-resolved
        state: restarted
  when: resolved_service.stat.exists

- name: Ensure /etc/resolv.conf is static (works for Proxmox too)
  block:
    - name: Backup current resolv.conf
      copy:
        src: /etc/resolv.conf
        dest: /etc/resolv.conf.backup
        remote_src: yes
        force: yes

    - name: Write static resolv.conf
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          options edns0 trust-ad
        owner: root
        group: root
        mode: '0644'

- name: Disable DHCP from overriding DNS (Debian/Proxmox)
  lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: '^supersede domain-name-servers'
    line: 'supersede domain-name-servers 1.1.1.1, 8.8.8.8;'
    create: yes
  notify: Restart networking

- name: Ensure DHCP domain is empty
  lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: '^supersede domain-name'
    line: 'supersede domain-name "";'
    create: yes
  notify: Restart networking

- name: Verify DNS is working
  shell: nslookup acme-v02.api.letsencrypt.org
  register: dns_test

- name: Show DNS test result
  debug:
    var: dns_test.stdout
