- name: Restart portainer
  shell: docker compose down && docker compose up -d --remove-orphans
  args:
    chdir: /opt/portainer

- name: Restart traefik
  shell: docker compose down && docker compose up -d --remove-orphans
  args:
    chdir: /opt/traefik

- name: Restart authentik
  shell: docker compose down && docker compose up -d --remove-orphans
  args:
    chdir: /opt/authentik
