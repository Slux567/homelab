- name: Generate k3s token if not provided
  set_fact:
    k3s_token: "{{ k3s_token | default(ansible_date_time.epoch + ansible_hostname) | hash('sha256') }}"
  run_once: true
  delegate_to: "{{ groups['controlplane'][0] }}"
  when: k3s_token is not defined or k3s_token == ""

- name: Set k3s token fact for all nodes
  set_fact:
    k3s_cluster_token: "{{ hostvars[groups['controlplane'][0]]['k3s_token'] }}"

- name: Display cluster token (for reference)
  debug:
    msg: "K3s cluster token: {{ k3s_cluster_token[:8] }}..."
  run_once: true