- name: Create .kube directory for admin user
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: inventory_hostname == groups['controlplane'][0]

- name: Wait for kubeconfig file to be created
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 60
  become: true
  when: inventory_hostname == groups['controlplane'][0]

- name: Copy kubeconfig to admin user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  become: true
  when: inventory_hostname == groups['controlplane'][0]

- name: Update kubeconfig server address
  replace:
    path: "{{ ansible_env.HOME }}/.kube/config"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ hostvars[groups['controlplane'][0]]['ansible_host'] }}:6443"
  when: inventory_hostname == groups['controlplane'][0]

- name: Set proper permissions on kubeconfig
  file:
    path: "{{ ansible_env.HOME }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  when: inventory_hostname == groups['controlplane'][0]