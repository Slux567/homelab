- name: Install required packages
  package:
    name:
      - curl
      - wget
      - apt-transport-https
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Create k3s directory
  file:
    path: /etc/k3s
    state: directory
    mode: '0755'
  become: true

- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Set k3s installation status
  set_fact:
    k3s_installed: "{{ k3s_binary.stat.exists }}"