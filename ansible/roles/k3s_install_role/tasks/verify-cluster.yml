- name: Wait for all nodes to be ready
  pause:
    seconds: 30

- name: Get cluster info
  command: kubectl get nodes -o wide
  register: cluster_nodes
  when: inventory_hostname == groups['controlplane'][0]
  changed_when: false
  failed_when: false

- name: Display cluster status
  debug:
    msg: "{{ cluster_nodes.stdout_lines }}"
  when: 
    - inventory_hostname == groups['controlplane'][0]
    - cluster_nodes.stdout_lines is defined

- name: Get cluster pods
  command: kubectl get pods --all-namespaces
  register: cluster_pods
  when: inventory_hostname == groups['controlplane'][0]
  changed_when: false
  failed_when: false

- name: Display system pods status
  debug:
    msg: "{{ cluster_pods.stdout_lines }}"
  when: 
    - inventory_hostname == groups['controlplane'][0]
    - cluster_pods.stdout_lines is defined

- name: Verify cluster health
  command: kubectl get componentstatuses
  register: cluster_health
  when: inventory_hostname == groups['controlplane'][0]
  changed_when: false
  failed_when: false

- name: Display cluster health
  debug:
    msg: "{{ cluster_health.stdout_lines }}"
  when: 
    - inventory_hostname == groups['controlplane'][0]
    - cluster_health.stdout_lines is defined