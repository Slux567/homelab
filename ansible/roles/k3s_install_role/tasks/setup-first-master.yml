- name: Install K3s on first master node
  shell: |
    curl -sfL https://get.k3s.io | sh -s - server \
      --cluster-init \
      --token={{ k3s_cluster_token }} \
      --tls-san={{ hostvars[inventory_hostname]['ansible_host'] }} \
      --tls-san={{ inventory_hostname }} \
      {% for master in groups['controlplane'] %}
      --tls-san={{ hostvars[master]['ansible_host'] }} \
      --tls-san={{ master }} \
      {% endfor %}
      --node-taint CriticalAddonsOnly=true:NoExecute \
      --disable=traefik \
      {{ k3s_server_args | default('') }}
  args:
    creates: /usr/local/bin/k3s
  become: true
  when: 
    - inventory_hostname in groups['controlplane']
    - inventory_hostname == groups['controlplane'][0]
    - not k3s_installed

- name: Wait for first master to be ready
  wait_for:
    port: 6443
    host: "{{ hostvars[groups['controlplane'][0]]['ansible_host'] }}"
    delay: 10
    timeout: 300
  when: 
    - inventory_hostname in groups['controlplane']
    - inventory_hostname == groups['controlplane'][0]

- name: Verify first master is responding
  uri:
    url: "https://{{ hostvars[groups['controlplane'][0]]['ansible_host'] }}:6443/ping"
    method: GET
    validate_certs: no
    status_code: 200
  register: master_health
  until: master_health.status == 200
  retries: 12
  delay: 5
  when: 
    - inventory_hostname in groups['controlplane']
    - inventory_hostname == groups['controlplane'][0]