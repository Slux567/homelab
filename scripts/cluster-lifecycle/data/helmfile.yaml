---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

repositories:
  - name: projectcalico
    url: https://docs.tigera.io/calico/charts

releases:
  - name: calico
    namespace: kube-system
    atomic: true
    chart: projectcalico/tigera-operator
    version: v3.31.3
    values: ['../../../kubernetes/apps/kube-system/calico/app/helm/values.yaml']

  - name: external-secrets
    namespace: security
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.0.1
    needs: ['kube-system/calico']

  - name: flux-operator
    namespace: flux-system
    atomic: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.43.0
    values: ['../../../kubernetes/apps/flux-system/flux-operator/app/helm/values.yaml']
    needs: ['security/external-secrets']

  - name: flux-instance
    namespace: flux-system
    atomic: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.43.0
    values: ['../../../kubernetes/apps/flux-system/flux-instance/app/helm/values.yaml']
    needs: ['flux-system/flux-operator']
