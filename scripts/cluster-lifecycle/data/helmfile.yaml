---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

repositories:
  - name: projectcalico
    url: https://docs.tigera.io/calico/charts

releases:
  - name: calico
    namespace: kube-system
    atomic: true
    chart: projectcalico/tigera-operator
    version: v3.31.3
    values: ['../../../kubernetes/apps/kube-system/calico/app/helm/values.yaml']

