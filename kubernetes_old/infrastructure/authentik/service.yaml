# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: authentik
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
---
# Authentik Server Service
apiVersion: v1
kind: Service
metadata:
  name: authentik-server-service
  namespace: authentik
spec:
  selector:
    app: authentik-server
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: https
      port: 9443
      targetPort: 9443
      protocol: TCP